// ============================================================
//  Kavita Ka Ghar — Android root build
//
//  NOTE: repositories yahan NAHI declare hoti —
//  settings.gradle me `dependencyResolutionManagement` se aati hain.
//  Warna error: "prefer settings repositories over project repositories"
// ============================================================
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
    }
}

// NOTE: 'clean' task jaan-boojh kar nahi rakha —
// Gradle 8.7 me purana `delete rootProject.buildDir` crash karta hai.
// Gradle ka apna `gradle clean` command use karo.
