plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kavitakaghar.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kavitakaghar.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   /* debug key se sign — sidha install hoga */
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /* APK chhota karne ke liye */
    androidResources {
        noCompress 'mp3'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
